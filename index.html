<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Life Simulator – Prototype</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#090b0e; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display:block; }
    #hud { position:fixed; inset:0; pointer-events:none; color:#fff; }
    .panel { position:absolute; left:18px; top:18px; width:min(360px, calc(100vw - 36px)); padding:14px 16px; border-radius:18px; background:rgba(8,10,14,.56); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(16px); box-shadow:0 18px 60px rgba(0,0,0,.35); }
    .title { font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.95; }
    .sub { margin-top:6px; font-size:12px; line-height:1.45; opacity:.72; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .chip { padding:7px 9px; border-radius:10px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08); font-size:11px; }
    #speed { position:absolute; right:22px; bottom:20px; min-width:160px; text-align:right; font-size:16px; text-shadow:0 2px 10px #000; }
    #speed strong { font-size:44px; line-height:.9; }
    #centerHint { position:absolute; left:50%; bottom:60px; transform:translateX(-50%); padding:10px 14px; border-radius:14px; background:rgba(8,10,14,.55); border:1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); font-size:12px; opacity:.9; }
    #reticle { position:absolute; left:50%; top:50%; width:6px; height:6px; transform:translate(-50%,-50%); border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.12); opacity:.8; }
    #minimap { position:absolute; right:18px; top:18px; width:170px; height:170px; border-radius:20px; background:rgba(8,10,14,.55); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(14px); overflow:hidden; }
    #miniCanvas{width:100%;height:100%;display:block;}
    #weather { position:absolute; left:18px; bottom:18px; font-size:12px; opacity:.75; }
    @media (max-width:720px){ .panel{width:250px}.sub{display:none} #minimap{width:120px;height:120px} #speed strong{font-size:34px} }
  </style>
</head>
<body>
<div id="hud">
  <div class="panel">
    <div class="title">REAL LIFE SIMULATOR · PROTOTYPE 01</div>
    <div class="sub">Kleine offene Stadt als technische Basis. Erst laufen, dann zum Auto gehen und mit <b>E</b> einsteigen.</div>
    <div class="row">
      <div class="chip">WASD · bewegen</div><div class="chip">Shift · schneller</div><div class="chip">E · Auto</div><div class="chip">R · Regen</div><div class="chip">N · Tag/Nacht</div>
    </div>
  </div>
  <div id="minimap"><canvas id="miniCanvas" width="340" height="340"></canvas></div>
  <div id="centerHint">Klicke ins Spiel, um die Maus zu steuern</div>
  <div id="reticle"></div>
  <div id="speed"><span id="mode">ZU FUSS</span><br><strong id="speedNum">0</strong> <span>km/h</span></div>
  <div id="weather">Trocken · 18°C</div>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.168.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.168.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9eb3c6);
scene.fog = new THREE.FogExp2(0xaab9c6, 0.0024);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.08, 1300);
camera.position.set(0, 1.7, 8);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xddeeff, 0x4b4a42, 1.55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d1, 4.0); sun.position.set(130,180,90); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-180; sun.shadow.camera.right=180; sun.shadow.camera.top=180; sun.shadow.camera.bottom=-180; scene.add(sun);

const world = new THREE.Group(); scene.add(world);
const asphalt = new THREE.MeshStandardMaterial({color:0x303338, roughness:.91, metalness:.02});
const sidewalkMat = new THREE.MeshStandardMaterial({color:0x8f9292, roughness:.95});
const grassMat = new THREE.MeshStandardMaterial({color:0x657352, roughness:1});
const lineMat = new THREE.MeshStandardMaterial({color:0xded9c8, roughness:.8});
const curbMat = new THREE.MeshStandardMaterial({color:0xbab7ae, roughness:.98});

const ground = new THREE.Mesh(new THREE.PlaneGeometry(900,900), grassMat); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; world.add(ground);

function box(w,h,d,mat,x,y,z,cast=true){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; world.add(m); return m; }
function road(x,z,w,d){ box(w,.05,d,asphalt,x,.025,z,false); }
function stripe(x,z,w,d){ box(w,.012,d,lineMat,x,.065,z,false); }

// Road grid
for(let x=-180;x<=180;x+=90){ road(x,0,18,420); for(let z=-190;z<=190;z+=12){ stripe(x,z,.22,4.2); } box(4,.16,420,sidewalkMat,x-11,.08,0,false); box(4,.16,420,sidewalkMat,x+11,.08,0,false); }
for(let z=-180;z<=180;z+=90){ road(0,z,420,18); for(let x=-190;x<=190;x+=12){ stripe(x,z,4.2,.22); } box(420,.16,4,sidewalkMat,0,.08,z-11,false); box(420,.16,4,sidewalkMat,0,.08,z+11,false); }

// Buildings
const buildingMats=[0x6f7479,0x8b8175,0x747b6c,0x8d8f93,0x726b65,0x9c9288].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.86}));
const windowMat = new THREE.MeshStandardMaterial({color:0x9cc1d4,roughness:.2,metalness:.25,emissive:0x16242d, emissiveIntensity:.18});
function building(x,z,w,d,h,mat){
  const b=box(w,h,d,mat,x,h/2,z);
  // windows simplified
  const floors=Math.max(2,Math.floor(h/4)); const cols=Math.max(2,Math.floor(w/5));
  for(let fy=0;fy<floors;fy++) for(let cx=0;cx<cols;cx++){
    const wx=x-w/2+3+cx*(w-6)/Math.max(1,cols-1); const wy=2.3+fy*3.6;
    const win=new THREE.Mesh(new THREE.PlaneGeometry(1.35,1.7),windowMat); win.position.set(wx,wy,z+d/2+.011); world.add(win);
  }
  return b;
}
const blocks=[];
for(let gx=-135;gx<=135;gx+=90){ for(let gz=-135;gz<=135;gz+=90){
  const corners=[[gx-22,gz-22],[gx+22,gz-22],[gx-22,gz+22],[gx+22,gz+22]];
  corners.forEach((p,i)=>{ const h=14+((Math.abs(gx*13+gz*7+i*31))%28); blocks.push(building(p[0],p[1],28,28,h,buildingMats[(i+Math.abs(gx+gz))%buildingMats.length])); });
}}

// Trees + street lamps
const trunkMat=new THREE.MeshStandardMaterial({color:0x59442f,roughness:1}); const leafMat=new THREE.MeshStandardMaterial({color:0x3c5940,roughness:1});
for(let x=-170;x<=170;x+=30){ for(const z of [-72,72,162,-162]){ if(Math.abs(x)%90<14) continue; const t=box(.6,4,.6,trunkMat,x,2,z); const crown=new THREE.Mesh(new THREE.SphereGeometry(2.4,9,7),leafMat); crown.position.set(x,5,z); crown.castShadow=true; world.add(crown);} }
const lampMat=new THREE.MeshStandardMaterial({color:0x25282b,roughness:.55,metalness:.55}); const bulbMat=new THREE.MeshStandardMaterial({color:0xffe7b4,emissive:0xffd27a,emissiveIntensity:0});
const bulbs=[];
for(let z=-180;z<=180;z+=45){ for(const x of [-12,12,78,102,-78,-102]){ const pole=box(.18,6,.18,lampMat,x,3,z); const arm=box(1.3,.12,.12,lampMat,x+(x>0?-.55:.55),5.8,z); const bulb=box(.5,.16,.32,bulbMat,x+(x>0?-1.1:1.1),5.65,z); bulbs.push(bulb); }}

// Player visual marker
const player = new THREE.Object3D(); player.position.set(6,0,14); scene.add(player);

// Car
const car = new THREE.Group();
const carBodyMat=new THREE.MeshPhysicalMaterial({color:0x1b1d20,metalness:.72,roughness:.2,clearcoat:1,clearcoatRoughness:.12});
const glassMat=new THREE.MeshPhysicalMaterial({color:0x19252d,transparent:true,opacity:.58,roughness:.08,metalness:.2});
const body=new THREE.Mesh(new THREE.BoxGeometry(2.05,.62,4.45),carBodyMat); body.position.y=.7; body.castShadow=true; car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.78,.7,2.15),glassMat); cabin.position.set(0,1.18,-.12); cabin.castShadow=true; car.add(cabin);
const wheelMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});
for(const sx of [-1,1]) for(const sz of [-1.45,1.45]){ const wh=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.26,18),wheelMat); wh.rotation.z=Math.PI/2; wh.position.set(sx*.96,.43,sz); wh.castShadow=true; car.add(wh); }
const lightFront=new THREE.MeshStandardMaterial({color:0xf6f2d6,emissive:0xffefb8,emissiveIntensity:1.6});
for(const x of [-.68,.68]){ const l=new THREE.Mesh(new THREE.BoxGeometry(.42,.18,.06),lightFront); l.position.set(x,.77,-2.24); car.add(l); }
car.position.set(4,0,-7); world.add(car);

// NPC traffic
const npcCars=[];
const colors=[0xb7483f,0x496c8a,0xc4c1b9,0x34373c,0x8b6f4c,0x4e7355];
for(let i=0;i<18;i++){
  const g=new THREE.Group(); const mat=new THREE.MeshPhysicalMaterial({color:colors[i%colors.length],metalness:.55,roughness:.28,clearcoat:.7});
  const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.55,3.8),mat); b.position.y=.55; b.castShadow=true; g.add(b);
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.5,.55,1.8),glassMat); c.position.set(0,1,-.15); g.add(c);
  const lane=(i%4); if(lane===0){g.position.set(-4.5,0,-180+i*20);g.userData={axis:'z',dir:1,speed:7+(i%5)}}
  if(lane===1){g.position.set(4.5,0,180-i*22);g.rotation.y=Math.PI;g.userData={axis:'z',dir:-1,speed:8+(i%4)}}
  if(lane===2){g.position.set(-180+i*23,0,85.5);g.rotation.y=-Math.PI/2;g.userData={axis:'x',dir:1,speed:6+(i%6)}}
  if(lane===3){g.position.set(180-i*21,0,94.5);g.rotation.y=Math.PI/2;g.userData={axis:'x',dir:-1,speed:7+(i%5)}}
  npcCars.push(g); world.add(g);
}

// Rain
const rainCount=1800; const rainGeo=new THREE.BufferGeometry(); const rainPos=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){ rainPos[i*3]=(Math.random()-.5)*180; rainPos[i*3+1]=Math.random()*70; rainPos[i*3+2]=(Math.random()-.5)*180; }
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rainMat=new THREE.PointsMaterial({color:0xcad8e8,size:.075,transparent:true,opacity:.55}); const rain=new THREE.Points(rainGeo,rainMat); rain.visible=false; scene.add(rain);

const controls=new PointerLockControls(camera, renderer.domElement);
renderer.domElement.addEventListener('click',()=>{ if(!controls.isLocked && !driving) controls.lock(); });
controls.addEventListener('lock',()=>document.getElementById('centerHint').style.display='none');
controls.addEventListener('unlock',()=>{ if(!driving) document.getElementById('centerHint').style.display='block'; });

const keys={}; addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyE'&&!e.repeat) toggleCar(); if(e.code==='KeyR'&&!e.repeat) toggleRain(); if(e.code==='KeyN'&&!e.repeat) toggleNight(); }); addEventListener('keyup',e=>keys[e.code]=false);
let driving=false, carSpeed=0, steer=0, night=false, raining=false;
function toggleCar(){
  if(!driving){ if(camera.position.distanceTo(car.position)<6.5){ driving=true; controls.unlock(); document.getElementById('mode').textContent='FAHRT'; document.getElementById('centerHint').textContent='E · aussteigen'; document.getElementById('centerHint').style.display='block'; } }
  else { driving=false; camera.position.copy(car.position).add(new THREE.Vector3(3,1.7,0)); player.position.copy(camera.position); document.getElementById('mode').textContent='ZU FUSS'; document.getElementById('centerHint').textContent='Klicke ins Spiel, um die Maus zu steuern'; }
}
function toggleRain(){ raining=!raining; rain.visible=raining; document.getElementById('weather').textContent=raining?'Regen · 15°C':'Trocken · 18°C'; if(raining){ scene.fog.density=.0036; asphalt.roughness=.48; renderer.toneMappingExposure=.95;} else {scene.fog.density=.0024; asphalt.roughness=.91; renderer.toneMappingExposure=night?.62:1.15;} }
function toggleNight(){ night=!night; if(night){ scene.background.set(0x0a1020); hemi.intensity=.24; sun.intensity=.1; bulbMat.emissiveIntensity=3.4; renderer.toneMappingExposure=.62; scene.fog.color.set(0x121826); } else { scene.background.set(0x9eb3c6); hemi.intensity=1.55; sun.intensity=4; bulbMat.emissiveIntensity=0; renderer.toneMappingExposure=raining?.95:1.15; scene.fog.color.set(0xaab9c6); } }

const clock=new THREE.Clock(); const v=new THREE.Vector3(); const forward=new THREE.Vector3(); const right=new THREE.Vector3();
function updateWalk(dt){
  if(!controls.isLocked) return;
  const speed=(keys.ShiftLeft?9.5:5.2)*dt;
  camera.getWorldDirection(forward); forward.y=0; forward.normalize(); right.crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
  v.set(0,0,0); if(keys.KeyW)v.add(forward); if(keys.KeyS)v.sub(forward); if(keys.KeyD)v.add(right); if(keys.KeyA)v.sub(right); if(v.lengthSq())v.normalize().multiplyScalar(speed); camera.position.add(v); camera.position.y=1.7; player.position.copy(camera.position);
}
function updateCar(dt){
  const accel=keys.KeyW?18:(keys.KeyS?-14:0); const brake=(!keys.KeyW&&!keys.KeyS)?2.8:0; carSpeed+=accel*dt; if(brake){ const s=Math.sign(carSpeed); carSpeed-=s*Math.min(Math.abs(carSpeed),brake*dt); } carSpeed=Math.max(-11,Math.min(34,carSpeed));
  const targetSteer=(keys.KeyA?1:0)+(keys.KeyD?-1:0); steer=THREE.MathUtils.lerp(steer,targetSteer,1-Math.pow(.002,dt)); if(Math.abs(carSpeed)>.15) car.rotation.y += steer*dt*(carSpeed/17)*1.5;
  forward.set(0,0,-1).applyQuaternion(car.quaternion); car.position.addScaledVector(forward,carSpeed*dt);
  const camTarget=car.position.clone().add(new THREE.Vector3(0,1.25,0)); const behind=new THREE.Vector3(0,3.1,8.5).applyQuaternion(car.quaternion).add(car.position); camera.position.lerp(behind,1-Math.pow(.00008,dt)); camera.lookAt(camTarget);
}
function updateNPC(dt){ for(const g of npcCars){ const u=g.userData; g.position[u.axis]+=u.dir*u.speed*dt; if(g.position[u.axis]>205)g.position[u.axis]=-205; if(g.position[u.axis]<-205)g.position[u.axis]=205; } }
function updateRain(dt){ if(!raining)return; const p=rainGeo.attributes.position.array; for(let i=0;i<rainCount;i++){ p[i*3+1]-=42*dt; if(p[i*3+1]<0)p[i*3+1]=65+Math.random()*10; p[i*3]+=0.9*dt; } rainGeo.attributes.position.needsUpdate=true; rain.position.set(camera.position.x,0,camera.position.z); }

const mini=document.getElementById('miniCanvas'), ctx=mini.getContext('2d');
function drawMap(){ const W=mini.width,H=mini.height,s=W/440; ctx.clearRect(0,0,W,H); ctx.fillStyle='#182022';ctx.fillRect(0,0,W,H); ctx.strokeStyle='#51585d';ctx.lineWidth=14*s; for(let k=-180;k<=180;k+=90){ctx.beginPath();ctx.moveTo(W/2+k*s,0);ctx.lineTo(W/2+k*s,H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,H/2+k*s);ctx.lineTo(W,H/2+k*s);ctx.stroke();} const pos=driving?car.position:camera.position; ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W/2+pos.x*s,H/2+pos.z*s,6,0,Math.PI*2);ctx.fill(); ctx.fillStyle='#cf3f3f';ctx.beginPath();ctx.arc(W/2+car.position.x*s,H/2+car.position.z*s,5,0,Math.PI*2);ctx.fill(); }

function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.04); if(driving)updateCar(dt); else updateWalk(dt); updateNPC(dt); updateRain(dt); drawMap(); document.getElementById('speedNum').textContent=driving?Math.round(Math.abs(carSpeed)*3.6):Math.round(v.length()/Math.max(dt,.001)*3.6); renderer.render(scene,camera); }
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
